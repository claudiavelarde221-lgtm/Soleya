name: Compilar Soleya

# Se ejecuta solo al subir cambios, o a mano desde la pestaña Actions -> "Run workflow".
on:
  push:
    branches: [main, claude/apk-project-review-30lt7q]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run apk
      - uses: actions/upload-artifact@v4
        with:
          name: Soleya-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Soleya-exe
          path: desktop/dist/Soleya.exe
